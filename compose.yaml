# Local PostgreSQL for development (matches Supabase's engine).
# Start:  docker compose up -d      (run from the repo root, in WSL)
# Stop:   docker compose down       (add -v to also delete the data volume)
# The credentials below are for this local container only and match
# ConnectionStrings:AppointmentBook in src/AppointmentBook.Api/appsettings.Development.json.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: appointmentbook
      POSTGRES_USER: appointmentbook
      POSTGRES_PASSWORD: appointmentbook-dev
    ports:
      - "5432:5432"
    volumes:
      - appointmentbook-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appointmentbook -d appointmentbook"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  appointmentbook-postgres-data:
